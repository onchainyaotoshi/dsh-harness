name: Gitleaks

on:
  push:
    branches: [master, 'feat/**', 'fix/**', 'chore/**', 'docs/**']
  pull_request:
    branches: [master]

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed so gitleaks can diff against base

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan (push event — diff from previous SHA)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          gitleaks detect \
            --source . \
            --log-opts "${{ github.event.before }}..${{ github.sha }}" \
            --verbose --redact --no-banner

      - name: Scan (push event — initial push / first scan of branch tip)
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: |
          gitleaks detect --source . --no-git --verbose --redact --no-banner

      - name: Scan (pull request — diff from base)
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect \
            --source . \
            --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --verbose --redact --no-banner
